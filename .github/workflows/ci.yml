name: CI

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      # app.py refuses to start without JWT_SECRET; use a CI-only throwaway value
      JWT_SECRET: ci-smoke-test-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: SAST - Bandit (static security analysis)
        run: |
          pip install bandit
          # 一次扫描同时产出 HTML 报告（artifact）并按 medium+ 严重级别决定成败
          bandit -r . -f html -o bandit-report.html --severity-level medium

      - name: SCA - pip-audit (dependency vulnerability check)
        run: |
          pip install pip-audit
          # Audits pinned requirements against the PyPA vulnerability database; non-zero exit on any known CVE
          pip-audit -r requirements.txt --strict

      - name: Smoke test - API starts and health endpoint responds
        run: |
          python -c "from app import init_db; init_db()"
          nohup python -m flask --app app run --port 5000 &
          sleep 3
          curl -sf http://127.0.0.1:5000/health

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.html
